<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#2b1b5a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="apple-touch-icon" href="../AssetsPHOTO/LOGO.jpg">
    <title>YASSINZN — ألعاب مغربية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #fff;
            --gold: #f4c542;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: pan-y
        }

        body {
            background: #2b1b5a;
            font-family: Cairo, Tahoma, sans-serif;
            color: var(--ink)
        }

        button {
            font-family: inherit
        }

        #bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -1
        }

        /* HUD & Top Bar */
        #hud {
            position: fixed;
            top: calc(12px + env(safe-area-inset-top, 0px));
            right: 15px;
            display: flex;
            gap: 12px;
            z-index: 10
        }

        .badge {
            background: #0b1d3add;
            border: 2px solid #ffd54f;
            border-radius: 24px;
            padding: 4px 14px;
            font-weight: 900;
            font-size: 16px;
            direction: ltr;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 0 #0006
        }

        /* UI Layout */
        #ui {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            overflow: auto;
            z-index: 5
        }

        .home-layout {
            width: min(1500px, 100%);
            height: min(94dvh, 900px);
            min-height: 550px;
            display: grid;
            grid-template-columns: minmax(300px, .9fr) minmax(460px, 1.1fr);
            gap: 16px;
            direction: ltr;
            margin: auto;
            text-align: center
        }

        .home-left,
        .home-right {
            direction: rtl;
            border: 3px solid #ffdf75;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 12px 0 #0006, inset 0 0 30px #fff2
        }

        .home-left {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 22px;
            background: linear-gradient(180deg, #11164db3, #9f2815a6), url('../AssetsPHOTO/IMG_8956.PNG') center/cover, linear-gradient(#673ab7, #f59e0b);
            position: relative
        }

        .profile-bar {
            align-self: stretch;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: #07132bdd;
            border: 2px solid #ffffff70;
            border-radius: 22px;
            text-align: right
        }

        .profile-avatar {
            width: 50px;
            height: 50px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: linear-gradient(#ffcc80, #ef5350);
            font-size: 33px;
            border: 3px solid #fff
        }

        .profile-name {
            font-weight: 900;
            flex: 1
        }

        .profile-level {
            color: #ffe082;
            font-size: 12px
        }

        .xp-track {
            height: 6px;
            margin-top: 3px;
            overflow: hidden;
            border-radius: 99px;
            background: #ffffff33;
        }

        .xp-track span {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #ffe082, #f59e0b);
        }

        .hero-brand {
            width: clamp(125px, 16vw, 205px);
            border: 4px solid white;
            border-radius: 28%;
            box-shadow: 0 8px 0 #0005;
        }

        .hero-character {
            font-size: clamp(90px, 15vw, 190px);
            line-height: .95;
            filter: drop-shadow(0 10px 5px #0008);
            margin-top: 5px
        }

        .hero-actions {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center
        }

        .hero-play {
            width: 100%;
            max-width: 400px;
            min-height: 82px;
            font-size: clamp(30px, 4vw, 48px);
            border: 5px solid #fff2a8;
            background: linear-gradient(#ffdf37, #f49a00 68%, #cd5b00);
            color: #fff;
            text-shadow: 0 3px 2px #743000;
            box-shadow: 0 9px 0 #773600, inset 0 2px 6px #fff9
        }

        .hero-small {
            min-width: 140px;
            font-size: 18px
        }

        .home-right {
            display: flex;
            flex-direction: column;
            padding: 18px;
            background: linear-gradient(180deg, #0a1a50ed, #651944ed), url('../AssetsPHOTO/IMG_8957.PNG') center/cover;
            overflow-y: auto
        }

        .ribbon {
            width: fit-content;
            align-self: center;
            min-width: min(80%, 340px);
            padding: 7px 18px;
            border: 4px solid #f5d77a;
            border-radius: 22px;
            background: linear-gradient(90deg, #0b513b, #08734e, #0b513b);
            box-shadow: 0 5px 0 #432500;
            font-size: clamp(19px, 2.5vw, 29px);
            margin: 2px 0 14px
        }

        .mode-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 9px;
            margin-bottom: 16px
        }

        .mode-card {
            border: 3px solid #fff;
            border-radius: 18px;
            min-height: 82px;
            padding: 8px 3px;
            color: #fff;
            font-weight: 900;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 5px 0 #0007;
            text-shadow: 0 2px 2px #0008;
            transition: transform .12s, filter .12s
        }

        .mode-card span {
            display: block;
            font-size: 29px;
            margin-bottom: 2px
        }

        .mode-card.selected {
            outline: 4px solid #ffe34d;
            transform: translateY(-3px);
            filter: brightness(1.2)
        }

        .mode-card:nth-child(1) {
            background: linear-gradient(#ef4444, #8e1010)
        }

        .mode-card:nth-child(2) {
            background: linear-gradient(#31bd55, #096528)
        }

        .mode-card:nth-child(3) {
            background: linear-gradient(#328df5, #143d9d)
        }

        .mode-card:nth-child(4) {
            background: linear-gradient(#ffb42c, #a94b00)
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 9px
        }

        .game-tile {
            min-width: 0;
            aspect-ratio: 1 / .88;
            border: 3px solid #fff;
            border-radius: 17px;
            color: white;
            font: 900 15px Cairo, Tahoma, sans-serif;
            text-shadow: 0 2px 2px #000b;
            cursor: pointer;
            box-shadow: 0 5px 0 #0007;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            transition: transform .12s, filter .12s;
            padding: 4px
        }

        .game-tile:hover,
        .mode-card:hover {
            transform: translateY(-3px);
            filter: brightness(1.15)
        }

        .game-tile .tile-icon {
            font-size: clamp(32px, 5vw, 58px);
            line-height: 1.1;
            filter: drop-shadow(0 3px 2px #0006)
        }

        .game-tile small {
            font-size: 11px;
            opacity: .9
        }

        .game-tile:nth-child(6n+1) {
            background: linear-gradient(145deg, #fb3553, #920c2c)
        }

        .game-tile:nth-child(6n+2) {
            background: linear-gradient(145deg, #25c75a, #07642e)
        }

        .game-tile:nth-child(6n+3) {
            background: linear-gradient(145deg, #209cff, #123b9c)
        }

        .game-tile:nth-child(6n+4) {
            background: linear-gradient(145deg, #ffca28, #ed6900)
        }

        .game-tile:nth-child(6n+5) {
            background: linear-gradient(145deg, #a542ec, #53128e)
        }

        .game-tile:nth-child(6n) {
            background: linear-gradient(145deg, #08c5bd, #075876)
        }

        .game-tile.available {
            box-shadow: 0 5px 0 #0007, 0 0 12px #fff5
        }

        .game-tile.team-unavailable {
            opacity: .58;
            filter: grayscale(.45)
        }

        .mode-summary {
            margin: 0 0 10px;
            color: #ffedb2;
            font-size: 13px
        }

        .home-right .hint {
            margin-top: 12px
        }

        /* Main Title */
        .title-box {
            margin-bottom: 15px
        }

        .brand-logo {
            width: clamp(100px, 20vw, 172px);
            aspect-ratio: 1;
            object-fit: cover;
            border: 5px solid #fff;
            border-radius: 30%;
            box-shadow: 0 8px 0 #0006, 0 0 28px #ffd54f88;
            margin-bottom: 10px
        }

        .subtitle {
            margin: 8px 0 0;
            color: #fff1c2;
            font-size: clamp(14px, 3vw, 19px);
            text-shadow: 0 2px 3px #0008
        }

        h1 {
            margin: 0;
            font-weight: 900;
            font-size: clamp(40px, 9vw, 85px);
            line-height: 1;
            color: #ffd54f;
            -webkit-text-stroke: 3px #7a1010;
            paint-order: stroke fill;
            text-shadow: 0 5px 0 #5a0b0b
        }

        h1 b {
            color: #3ddc5a;
            -webkit-text-stroke: 3px #0d4a1c;
            display: inline-block;
            text-shadow: 0 5px 0 #073012
        }

        /* Menu Grid */
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 550px;
            align-items: center
        }

        .row-btns {
            display: flex;
            gap: 12px;
            width: 100%
        }

        .hint {
            margin: 0;
            color: #fff4c2;
            font-size: 14px;
            line-height: 1.7
        }

        .game-card {
            width: 100%;
        }

        .game-card small {
            display: block;
            font: 700 13px Cairo, Tahoma, sans-serif;
            opacity: .9;
            margin-top: 3px
        }

        .info-panel {
            width: min(92vw, 520px);
            padding: 18px;
            border: 2px solid #ffd54f;
            border-radius: 20px;
            background: #0b1d3add;
            box-shadow: 0 8px 0 #0005;
            line-height: 1.8
        }

        .info-panel p {
            margin: 8px 0
        }

        .ready-card {
            width: min(92vw, 560px);
            padding: 22px;
            border: 3px solid #ffe082;
            border-radius: 24px;
            background: linear-gradient(145deg, #12245df2, #471b5bed);
            box-shadow: 0 10px 0 #0006;
        }

        .roster-title {
            margin: 14px 0 8px;
            color: #ffe082;
            font-size: 19px;
        }

        .roster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 8px;
            max-height: 34vh;
            overflow-y: auto;
            padding: 3px 4px 8px;
        }

        .roster-card {
            display: grid;
            grid-template-columns: 52px 1fr auto;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border: 2px solid var(--character-color);
            border-radius: 16px;
            background: linear-gradient(135deg, #0d1d42e8, #332050e8);
            text-align: right;
        }

        .roster-avatar {
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            border-radius: 15px;
            background: linear-gradient(145deg, var(--character-color), #101b35);
            font-size: 30px;
            box-shadow: inset 0 2px 6px #fff8, 0 3px 5px #0008;
        }

        .roster-name {
            font-weight: 900;
            color: #fff;
        }

        .roster-kit {
            display: block;
            color: #ffe082;
            font-size: 11px;
        }

        .roster-switch {
            display: flex;
            gap: 4px;
        }

        .roster-switch button {
            width: 34px;
            min-height: 38px;
            padding: 0;
            border-radius: 10px;
            font-size: 17px;
        }

        .progress-chip {
            display: inline-flex;
            gap: 9px;
            flex-wrap: wrap;
            justify-content: center;
            color: #ffe082;
            font-weight: 900;
        }

        .ready-icon {
            font-size: clamp(52px, 12vw, 88px);
            line-height: 1.1
        }

        .ready-title {
            margin: 4px 0;
            color: #ffe082;
            font-size: clamp(24px, 6vw, 38px)
        }

        .ready-description {
            margin: 8px 0 14px;
            color: #fff;
            font-size: 16px
        }

        .ready-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 12px 0 18px
        }

        .control-chip {
            padding: 7px 12px;
            border: 1px solid #ffffff80;
            border-radius: 14px;
            background: #ffffff18;
            font-weight: 900
        }

        .ready-start {
            min-width: 210px;
            margin: 0 auto;
            font-size: 23px
        }

        .pause-btn {
            margin-top: 8px;
            padding: 8px 18px;
            font-size: 16px
        }

        .pause-banner {
            position: absolute;
            inset: 0;
            z-index: 25;
            display: grid;
            place-items: center;
            border-radius: 16px;
            background: #07132dbb;
            color: #fff;
            font-size: clamp(24px, 6vw, 42px);
            font-weight: 900;
            text-shadow: 0 3px 5px #000;
            pointer-events: none
        }

        .pause-banner[hidden] {
            display: none
        }

        .control-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px 15px;
            text-align: right
        }

        /* Buttons Styling */
        .b {
            font: 900 20px Cairo, Tahoma, sans-serif;
            padding: 14px 20px;
            border-radius: 20px;
            border: 3px solid #fff9;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 6px 0 #0007;
            text-shadow: 0 2px 0 #0006;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex: 1;
            transition: transform 0.1s
        }

        .b:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0007
        }

        .r {
            background: linear-gradient(#ef4a45, #a01818);
            border-color: #ff9996
        }

        .gr {
            background: linear-gradient(#3fb85a, #14692c);
            border-color: #86efac
        }

        .y {
            background: linear-gradient(#ffd54f, #f29a14);
            color: #4a2c00;
            text-shadow: none;
            border-color: #fff
        }

        .blue {
            background: linear-gradient(#3b82f6, #1d4ed8);
            border-color: #93c5fd
        }

        /* Sidebar Floating Buttons */
        .side-bar {
            position: fixed;
            left: 15px;
            top: 80px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10
        }

        .side-btn {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(#f59e0b, #b45309);
            border: 3px solid #fff;
            font-size: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 0 #0007
        }

        /* Game Canvas View */
        #game-container {
            position: relative;
            width: min(94vw, calc((100vh - 120px)*16/9));
            aspect-ratio: 16/9;
            margin: auto
        }

        #game-container.board-game {
            width: min(92vw, calc(100dvh - 76px), 620px);
            aspect-ratio: 1;
        }

        #game-container.board-game #cv,
        #game-container.board-game canvas {
            width: 100%;
            height: 100%;
        }

        #cv canvas {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            border: 4px solid var(--gold);
            border-radius: 14px;
            box-shadow: 0 8px 0 #0006;
            display: block
        }

        /* Touch Controls Overlay */
        #touch-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 20;
            display: none
        }

        #touch-overlay.button-controls .t-pad {
            position: absolute;
            width: 40%;
            height: 44%;
            display: grid;
            grid-template-columns: repeat(3, clamp(34px, 8vw, 58px));
            grid-template-rows: repeat(2, clamp(34px, 8vw, 58px));
            gap: clamp(3px, 1vw, 8px);
            pointer-events: none;
        }

        .gesture-pad {
            grid-column: 1 / 3;
            grid-row: 1 / 3;
            display: grid;
            place-items: center;
            min-width: 0;
            min-height: 0;
            border: 2px solid #ffffff9c;
            border-radius: 22px;
            color: #fff;
            background: radial-gradient(ellipse at center, #ffffff35, #07152bb8 75%);
            box-shadow: inset 0 2px 8px #fff3, 0 4px 10px #0007;
            font: 900 clamp(11px, 2.3vw, 17px) Cairo, Tahoma, sans-serif;
            text-shadow: 0 2px 4px #000;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .gesture-pad.active {
            background: radial-gradient(ellipse at center, #ffe08277, #07152bd8 75%);
        }

        #touch-overlay.button-controls .t-pad.single-action .gesture-pad {
            display: none;
        }

        #touch-overlay.button-controls .p0-pad {
            left: 10px;
            bottom: 8px;
        }

        #touch-overlay.button-controls .p1-pad {
            right: 10px;
            top: 8px;
        }

        #touch-overlay.button-controls .p2-pad {
            right: 10px;
            bottom: 8px;
        }

        #touch-overlay.button-controls .p3-pad {
            left: 10px;
            top: 8px;
        }

        .touch-key {
            min-width: 0;
            min-height: 0;
            padding: 0;
            pointer-events: auto;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            border: 2px solid #fff;
            border-radius: 14px;
            color: #fff;
            background: linear-gradient(#354d70e8, #101b35e8);
            box-shadow: 0 4px 0 #0009, inset 0 1px 3px #fff5;
            font: 900 clamp(14px, 3vw, 23px) Cairo, Tahoma, sans-serif;
        }

        .touch-key:active,
        .touch-key.pressed {
            transform: translateY(3px) scale(.96);
            filter: brightness(1.3);
        }

        .touch-key[data-key="action"] {
            background: linear-gradient(#eb544d, #9e1515);
            border-color: #ffaaa4;
            grid-column: 3;
            grid-row: 1;
        }

        #touch-overlay.button-controls .t-pad.single-action .touch-key[data-key="action"] {
            grid-column: 1 / 4;
            grid-row: 1 / 3;
            width: 100%;
            height: 100%;
            border-radius: 22px;
            font-size: clamp(22px, 5vw, 38px);
        }

        #touch-overlay.button-controls .t-pad.single-action .touch-key[data-key="action"] {
            grid-column: 2;
            grid-row: 1;
        }

        .t-pad {
            position: absolute;
            pointer-events: auto;
            display: flex;
            direction: ltr;
            align-items: center;
            justify-content: center
        }

        /* Touch Button Layouts for P1-P4 */
        .p0-pad {
            bottom: 10px;
            left: 12px;
            gap: 14px
        }

        .p1-pad {
            top: 10px;
            right: 12px;
            flex-direction: row-reverse;
            gap: 14px
        }

        .p2-pad {
            bottom: 10px;
            right: 12px;
            flex-direction: row-reverse;
            gap: 14px
        }

        .p3-pad {
            top: 10px;
            left: 12px;
            gap: 14px
        }

        .playing #hud,
        .playing .side-bar {
            display: none
        }

        @media (orientation: portrait) and (max-width: 900px) {
            body.playing {
                overflow: hidden;
            }

            body.playing #ui {
                overflow: hidden;
                padding: 0;
            }

            body.playing #game-container:not(.board-game) {
                position: fixed;
                left: 50%;
                top: 50%;
                width: min(94dvh, 166.4vw);
                aspect-ratio: 16 / 9;
                margin: 0;
                transform: translate(-50%, -50%) rotate(90deg);
                transform-origin: center;
            }

            body.playing #ui>.row-btns {
                position: fixed;
                z-index: 31;
                left: 50%;
                bottom: max(8px, env(safe-area-inset-bottom));
                width: min(94vw, 480px) !important;
                margin: 0 !important;
                transform: translateX(-50%);
                flex-direction: row;
            }

            body.playing #game-container.board-game {
                width: min(92vw, calc(100dvh - 92px), 620px);
                position: relative;
                left: auto;
                top: auto;
                transform: none;
                margin: auto;
            }
        }

        @media (max-width: 600px) {
            #touch-overlay.compact-controls .t-pad {
                gap: 6px
            }

            #touch-overlay.button-controls .t-pad {
                width: 48%;
                height: 46%;
                grid-template-columns: repeat(3, clamp(32px, 11vw, 50px));
                grid-template-rows: repeat(2, clamp(32px, 11vw, 50px));
                gap: 3px;
            }

            .gesture-pad {
                border-radius: 18px;
            }
        }

        .home-screen #hud,
        .home-screen .side-bar {
            display: none
        }

        @media (max-width: 600px) {
            #ui {
                padding: 12px;
                justify-content: flex-start;
                padding-top: 74px;
                padding-bottom: 18px
            }

            .row-btns {
                flex-direction: column
            }

            .b {
                font-size: 17px;
                padding: 11px 14px
            }

            .side-bar {
                left: 8px;
                top: 68px;
                gap: 7px
            }

            .side-btn {
                width: 44px;
                height: 44px;
                font-size: 21px
            }

            .brand-logo {
                width: 112px
            }

            #game-container {
                width: min(94vw, calc((100dvh - 155px)*16/9))

<body>
    <canvas id="bg"></canvas>

    <!-- Top HUD -->
    <div id="hud">
        <div class="badge">🎮 YASSINZN</div>
    </div>

    <!-- Side Floating Menu -->
    <div class="side-bar">

        <button class="side-btn" onclick="settings()" aria-label="الإعدادات">⚙️</button>
        <button class="side-btn" onclick="chooseMode('tour')" aria-label="البطولة">🏆</button>
    </div>

    <!-- Main UI Container -->
    <div id="ui"></div>

    <script>
        const bg = document.getElementById('bg'), bx = bg.getContext('2d'), ui = document.getElementById('ui');

        let installPrompt;
        addEventListener('beforeinstallprompt', event => {
            event.preventDefault();
            installPrompt = event;
            const button = document.getElementById('install-app');
            if (button) button.hidden = false;
        });
        addEventListener('appinstalled', () => {
            installPrompt = null;
            const button = document.getElementById('install-app');
            if (button) button.hidden = true;
        });
        async function installApp() {
            if (!installPrompt) {
                alert('من قائمة المتصفح اختار «إضافة إلى الشاشة الرئيسية» باش تلعب بحال التطبيق.');
                return;
            }
            await installPrompt.prompt();
            installPrompt = null;
            const button = document.getElementById('install-app');
            if (button) button.hidden = true;
        }
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
            addEventListener('load', () => navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(error => console.warn('Offline support unavailable:', error)));
        }

        function palm(x, y, h, s) { bx.strokeStyle = '#5a3b1e'; bx.lineWidth = s * 4; bx.beginPath(); bx.moveTo(x, y); bx.quadraticCurveTo(x + s * 8, y - h / 2, x + s * 3, y - h); bx.stroke(); bx.strokeStyle = '#1e7a3a'; bx.lineWidth = s * 3; for (let a = -2; a <= 2; a++) { bx.beginPath(); bx.moveTo(x + s * 3, y - h); bx.quadraticCurveTo(x + s * 3 + a * s * 12, y - h - s * 18, x + s * 3 + a * s * 20, y - h + s * 10); bx.stroke() } }
        function drawBG() {
            const w = bg.width = innerWidth, h = bg.height = innerHeight, u = h / 450, gy = h * .8;
            let g = bx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#2e2370'); g.addColorStop(.4, '#d9584e'); g.addColorStop(.7, '#ffae5c'); g.addColorStop(1, '#ffd98a'); bx.fillStyle = g; bx.fillRect(0, 0, w, h);
            bx.fillStyle = '#b5562f'; for (let x = 0; x < w; x += 46) { let bh = h * .1 + ((x * 7) % 5) * h * .014; bx.fillRect(x, gy - bh, 43, bh + h) }
            palm(w * .06, h, h * .5, u * 1.6); palm(w * .9, h, h * .45, u * 1.5);
            for (let x = 0, i = 0; x < w; x += 34, i++) { bx.fillStyle = ['#a01818', '#14692c', '#f2b01e', '#1d5fb4'][i % 4]; bx.fillRect(x, h - 12, 34, 12) }
        }
        addEventListener('resize', drawBG); drawBG();

        const C = ['#e53935', '#1e88e5', '#43a047', '#fdd835'], TC = ['#e53935', '#2e9e4f'], TN = ['الأحمر', 'الأخضر'];
        const audioBase = new URL('../AssetsAudio/', document.baseURI);
        const activeSounds = new Set();
        const KM = [{ u: 'w', d: 's', l: 'a', r: 'd', a: ' ' }, { u: 'arrowup', d: 'arrowdown', l: 'arrowleft', r: 'arrowright', a: 'enter' }, { u: 'i', d: 'k', l: 'j', r: 'l', a: 'h' }, { u: '8', d: '5', l: '4', r: '6', a: '0' }];
        const touchState = Array.from({ length: 4 }, () => ({ dx: 0, dy: 0, actions: new Set() }));
        const touchButtons = Array.from({ length: 4 }, () => ({ left: new Set(), right: new Set(), up: new Set(), down: new Set(), action: new Set() }));
        const touchGestures = Array.from({ length: 4 }, () => new Map());

        const keys = {};
        addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = 1;
            if (/^arrow/i.test(e.key) || e.key === ' ') e.preventDefault();
            if (S?.g?.handleKey && !S.paused && !S.g.done) S.g.handleKey(e);
        });
        addEventListener('keyup', e => keys[e.key.toLowerCase()] = 0);
        addEventListener('blur', clearInputs);

        function clearInputs() {
            Object.keys(keys).forEach(key => keys[key] = 0);
            touchState.forEach(state => { state.dx = 0; state.dy = 0; state.actions.clear(); });
            touchButtons.forEach(state => Object.values(state).forEach(set => set.clear()));
            touchGestures.forEach(gestures => gestures.clear());
            document.querySelectorAll('.gesture-pad.active').forEach(pad => pad.classList.remove('active'));
            document.querySelectorAll('.touch-key.pressed').forEach(button => button.classList.remove('pressed'));
        }

        const inp = i => {
            const k = KM[i];
            const t = touchState[i];
            const buttons = touchButtons[i];
            let gestureX = 0, gestureY = 0;
            for (const gesture of touchGestures[i].values()) { gestureX += gesture.dx; gestureY += gesture.dy; }
            const dx = (!!keys[k.r] - !!keys[k.l]) + (!!buttons.right.size - !!buttons.left.size) + t.dx + gestureX;
            const dy = (!!keys[k.d] - !!keys[k.u]) + (!!buttons.down.size - !!buttons.up.size) + t.dy + gestureY;
            return {
                dx: Math.max(-1, Math.min(1, dx)),
                dy: Math.max(-1, Math.min(1, dy)),
                a: !!keys[k.a] || !!buttons.action.size || t.actions.size > 0,
                up: !!keys[k.u] || !!buttons.up.size || t.dy < -.35 || ([4, 6].includes(S.cur) && (!!buttons.action.size || t.actions.size > 0))
            };
        };

        const gc = document.createElement('canvas'); gc.width = 800; gc.height = 450; const x = gc.getContext('2d');
        let savedSound = 'on';
        try { savedSound = localStorage.getItem('yassinzn-sound') || 'on'; } catch (error) { console.warn('Settings storage unavailable:', error); }
        const CHARACTERS = [
            { name: 'ياسين', kit: 'قميص أحمر · قائد الفريق', icon: '🧒🏻', color: '#e53935' },
            { name: 'سلمى', kit: 'طقم أخضر · لاعبة سريعة', icon: '👧🏻', color: '#25a65a' },
            { name: 'حمزة', kit: 'طقم أزرق · مهاجم', icon: '🧑🏽', color: '#2585db' },
            { name: 'لينا', kit: 'طقم بنفسجي · مراوغة', icon: '👩🏽', color: '#a64ee8' },
            { name: 'آدم', kit: 'طقم ذهبي · حارس', icon: '🧑🏻‍🦱', color: '#eca92c' },
            { name: 'نور', kit: 'طقم سماوي · متجولة', icon: '👩🏻‍🦱', color: '#16b9c3' }
        ];
        const DEFAULT_PROFILE = { coins: 55000, gems: 25, xp: 0, level: 1, matches: 0, wins: 0, playerStats: [], characters: [0, 1, 2, 3] };
        function loadProfile() {
            try {
                const saved = JSON.parse(localStorage.getItem('yassinzn-profile') || '{}');
                const characters = Array.isArray(saved.characters) ? saved.characters : [];
                return { ...DEFAULT_PROFILE, ...saved, characters: Array.from({ length: 4 }, (_, i) => Number.isInteger(characters[i]) ? ((characters[i] % CHARACTERS.length) + CHARACTERS.length) % CHARACTERS.length : DEFAULT_PROFILE.characters[i]), playerStats: Array.isArray(saved.playerStats) ? saved.playerStats : [] };
            } catch (error) { console.warn('Progress storage unavailable:', error); return { ...DEFAULT_PROFILE, characters: DEFAULT_PROFILE.characters.slice(), playerStats: [] }; }
        }
        const profile = loadProfile();
        const S = { wins: [0, 0, 0, 0], points: [0, 0, 0, 0], soundOff: savedSound === 'off', mode: 'solo', n: 1, characters: profile.characters, profile };
        let raf, last;
        function saveProfile() { try { localStorage.setItem('yassinzn-profile', JSON.stringify(S.profile)); } catch (error) { console.warn('Progress could not be saved:', error); } }
        function refreshLevel() { S.profile.level = Math.floor(Math.max(0, S.profile.xp) / 100) + 1; }
        function characterFor(player) { return CHARACTERS[S.characters[player] ?? (player % CHARACTERS.length)]; }
        function playerColor(player) { return characterFor(player).color; }
        function playerName(player) { return characterFor(player).name; }
        function cycleCharacter(player, step) {
            S.characters[player] = (S.characters[player] + step + CHARACTERS.length) % CHARACTERS.length;
            S.profile.characters = S.characters.slice(); saveProfile(); play(S.cur);
        }
        const resultSoundFiles = {
            win: [
                ['RBA7', 'قويتي Moroccan Memes Sound Effects.mp3'],
                ['RBA7', 'كأنما انت شيء حوا جميع المعاني Moroccan Memes Sound Effect.mp3']
            ],
            loss: [
                ['KHSARA', 'شنو هاد المهزلة كنعيشو Moroccan Memes Sound Effect.mp3'],
                ['KHSARA', 'ابراهيم ارحمني Moroccan Memes Sound Effect.mp3']
            ],
            draw: [
                ['TA3ADOL', 'ياك أخويا مروان.. ياك أخويا لعزيز Moroccan Memes Sound Effect.mp3'],
                ['TA3ADOL', 'وا فشكال هاد بنادم كريزي مان Moroccan Memes Sound Effects.mp3']
            ]
        };
        function playSound(folder, filename, volume = .7) {
            if (S.soundOff) return Promise.resolve(false);
            const source = new URL(`${folder}/${filename.split('/').map(encodeURIComponent).join('/')}`, audioBase);
            const audio = new Audio(source.href);
            activeSounds.add(audio);
            audio.preload = 'auto';
            audio.volume = volume;
            const release = () => activeSounds.delete(audio);
            audio.addEventListener('ended', release, { once: true });
            audio.addEventListener('error', release, { once: true });
            return audio.play().then(() => true).catch(error => {
                release();
                console.warn(`Audio could not play: ${source.href}`, error);
                return false;
            });
        }

        function playResultSound(result) {
            if (S.soundOff) return;
            const choices = resultSoundFiles[result];
            if (!choices?.length) return;
            const [folder, filename] = choices[Math.floor(Math.random() * choices.length)];
            playSound(folder, filename, .85);
        }

        function gameOutcome(g) {
            if (g.outcome) return g.outcome;
            if (/تعادل|تعادلو|draw|tie/i.test(g.msg)) return 'draw';
            if (S.mode === 'solo') return g.win.includes(0) ? 'win' : 'loss';
            return g.win.length ? 'win' : 'draw';
        }

        document.addEventListener('pointerdown', e => {
            if (S.soundOff || !e.target.closest('button') || e.target.closest('.touch-key')) return;
            playSound('CLICK', 'click1.mp3.mp3', .45);
        });

        document.addEventListener('click', e => {
            if (S.soundOff || e.detail !== 0 || !e.target.closest('button') || e.target.closest('.touch-key')) return;
            playSound('CLICK', 'click1.mp3.mp3', .45);
        });

        function scr(h) { ui.innerHTML = h }
        const back = '<button class="b gr" onclick="menu()" style="margin-top:10px">رجوع</button>';

        function menu() {
            cancelAnimationFrame(raf);
            clearInputs();
            document.body.classList.remove('playing');
            document.body.classList.add('home-screen');
            scr(`
                <div class="home-layout">
                    <section class="home-left">
                        <div class="profile-bar"><div class="profile-avatar">${CHARACTERS[S.characters[0] || 0].icon}</div><div class="profile-name">🇲🇦 YASSINZN<div class="profile-level">المستوى ${S.profile.level} · ${S.profile.xp % 100}/100 XP · ${S.profile.wins} انتصارات</div><div class="xp-track"><span style="width:${S.profile.xp % 100}%"></span></div></div><span>💎 ${S.profile.gems}<br>🪙 ${S.profile.coins}</span></div>
                        <div><img class="hero-brand" src="../AssetsPHOTO/LOGO.jpg" alt="YASSINZN"><div class="hero-character" aria-hidden="true">🧑🏻‍🎓⚽</div><p class="subtitle">مرحبا بيك فالألعاب المغربية!</p></div>
                        <div class="hero-actions"><button class="b hero-play" onclick="focusGames()">اللعب ▶</button><button id="install-app" class="b y hero-small" onclick="installApp()" hidden>📲 ثبّت اللعبة</button><button class="b blue hero-small" onclick="chooseMode('multi')">👥 الأصدقاء</button><button class="b gr hero-small" onclick="shop()">🛒 المتجر</button><button class="b blue hero-small" onclick="settings()">⚙️ الإعدادات</button></div>
                    </section>
                    <section class="home-right" id="game-menu">
                        <h2 class="ribbon">اختار نمط اللعب</h2>
                        <div class="mode-grid">
                            <button class="mode-card ${S.mode === 'solo' ? 'selected' : ''}" onclick="chooseMode('solo')"><span>🧑🏻</span>لاعب واحد ضد AI</button>
                            <button class="mode-card ${S.mode === 'multi' ? 'selected' : ''}" onclick="chooseMode('multi')"><span>👥</span>صحابك 2–4</button>
                            <button class="mode-card ${S.mode === 'team' ? 'selected' : ''}" onclick="chooseMode('team')"><span>🛡️</span>فريق ضد فريق 2v2</button>
                            <button class="mode-card ${S.mode === 'tour' ? 'selected' : ''}" onclick="chooseMode('tour')"><span>🏆</span>البطولة</button>
                        </div>
                        ${(S.mode === 'multi' || S.mode === 'tour') ? `<p class="mode-summary">عدد اللاعبين: ${[2, 3, 4].map(n => `<button class="b ${S.n === n ? 'y' : 'blue'}" style="display:inline-flex;min-width:44px;padding:3px 10px;font-size:14px" onclick="setPlayers(${n})">${n}</button>`).join(' ')}</p>` : `<p class="mode-summary">${modeDescription()}</p>`}
                        <h2 class="ribbon" id="games">اختار اللعبة</h2>
                        <div class="game-grid">${GAME_CATALOGUE.map(game => {
                const unavailable = S.mode === 'team' && ![0, 2, 9].includes(game.id);
                return `<button class="game-tile available ${unavailable ? 'team-unavailable' : ''}" onclick="selectGame(${game.id})" aria-label="${game.name}"><span class="tile-icon">${game.icon}</span><span>${game.name}</span><small>${unavailable ? 'غير متاح 2v2' : 'العب دابا'}</small></button>`;
            }).join('')}</div>
                        <p class="hint">اختار أي لعبة وابدأ اللعب. فالمنافسة، استعمل أزرار كل لاعب اللي باينين فالشاشة.</p>
                    </section>
                </div>
            `);
        }

        function focusGames() { document.getElementById('games')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
        function chooseMode(mode) {
            S.mode = mode;
            S.wins = [0, 0, 0, 0];
            S.points = [0, 0, 0, 0];
            S.queue = [];
            if (mode === 'solo') S.n = 1;
            else if (mode === 'team') S.n = 4;
            else if (!S.n || S.n < 2) S.n = 2;
            menu();
        }
        function setPlayers(n) { S.n = n; S.wins = [0, 0, 0, 0]; S.points = [0, 0, 0, 0]; menu(); }
        function modeDescription() {
            return S.mode === 'team' ? 'فريقين، كل فريق فيه جوج لاعبين. لعبو الكرة، الدبابة، ولا خطف العلم.' : 'لاعب واحد ضد الكمبيوتر الذكي.';
        }
        function selectGame(id) {
            const game = GAME_CATALOGUE.find(item => item.id === id);
            if (S.mode === 'team' && ![0, 2, 9].includes(id)) { showNotice('هاد النمط كيدعم دابا كرة القدم والدبابة وخطف العلم 2 ضد 2.'); return; }
            if (game.gameIndex !== undefined) {
                if (S.mode === 'tour') S.queue = G.map((_, index) => index).filter(index => index !== game.gameIndex);
                play(game.gameIndex);
                return;
            }
            showNotice(`${game.icon} ${game.name}: ${game.description} هاد اللعبة غادي نزيدوها فالتحديثات الجاية.`);
        }
        function showNotice(message) {
            scr(`<div class="info-panel"><h2>🎮 YASSINZN</h2><p>${message}</p><button class="b gr" onclick="menu()">رجوع</button></div>`);
        }

        function instructionsFor(i) {
            const move = S.n > 1 && S.mode !== 'solo' ? 'فاللمس: كل لاعب يسحب فالمربع ديالو' : 'فاللمس: اسحب فمربع التحكم';
            const keyboard = ' · PC: WASD / الأسهم / IJKL / numpad';
            const map = {
                0: ['حرّك اللاعب وخلي جسمك يضرب الكورة؛ سجّل 3 أهداف.', `${move} · اسحب فالاتجاه اللي بغيتي${keyboard}`],
                1: ['بدّل بين 3 مسارات وتفادى السيارات؛ السرعة وكثافة السير كيزيدو تدريجياً.', `${move} · اسحب يمين ويسار${keyboard}`],
                2: ['الدبابة كتدور بوحدها ملي كتوقف. شدّ زر النار باش تطلق وتندفع فالجهة اللي كتواجه.', `${move} · شدّ 🔥 باش تطلق وتتحرك${keyboard}`],
                3: ['حرّك الصاروخ غير لليسار ولا لليمين وتفادى الحجارة اللي كتسرع.', `${move} · اسحب يمين ويسار${keyboard}`],
                4: ['قفز فوق الحواجز المتحركة والثابتة؛ أي اصطدام كيقصيك من السباق.', `${move} · زر القفز ⬆️${keyboard}`],
                5: ['حفظ 4 مكونات فـ5 ثواني، ومن بعد اختارهم من بين 10. أول طاجين صحيح كيربح.', `${move} · اختار المكونات واضغط تأكيد`],
                6: ['خلي الحمامة تطير بتكرار الضغط على زر الطيران وتفادى الحواجز.', `${move} · ضغطة وحدة = رفرفة${keyboard}`],
                7: ['سابق فطريق مستقيم طويل من 3 لفات؛ بدّل المسار، تفادى الحواجز واستعمل التيربو.', `${move} · اسحب يمين ويسار · ⚡ تيربو${keyboard}`],
                8: ['سابق فالصحراء، بدّل المسار باش تفادى الكثبان. زر ⚡ كيعطيك سرعة.', `${move} · أزرار الاتجاه · ⚡ دفعة سرعة`],
                9: ['خطف علم الخصم ورجعو لقاعدتك. الشخصية كتدور بوحدها؛ شدّ زر النار باش تتحرك فالجهة اللي كتواجه وتطلق على الخصم.', `${move} · وقف للتدوير · شدّ 🔥 للحركة وإطلاق النار${keyboard}`],
                10: ['شطرنج بالقوانين الأساسية؛ ربح بالكش مات ضد الكمبيوتر أو لاعب آخر.', 'اللمس: اختار القطعة ثم المربع · الكمبيوتر: الأسهم و Enter/Space'],
                11: ['الدّامة: كلّ على إجبارية، سلسلة القفزات، والترقية لملك.', 'اللمس: اختار القطعة ثم المربع · الكمبيوتر: الأسهم و Enter/Space'],
                12: ['حلّ سودوكو منطقي؛ الأرقام ما خاصهاش تتكرر فالسطور والأعمدة والمربعات.', 'اللمس: اختار الخانة والرقم · الكمبيوتر: الأسهم والأرقام و H للمساعدة']
            };
            return map[i] || ['استمتع باللعب!', move];
        }

        function startGame(i) {
            S.cur = i;
            S.paused = false;
            document.body.classList.add('playing');
            document.body.classList.remove('home-screen');
            scr(`
                <div id="game-container">
                    <div id="cv"></div>
                    <div id="touch-overlay"></div>
                    <div id="pause-banner" class="pause-banner" hidden>⏸️ وقفنا شوية</div>
                </div>
                <div class="row-btns" style="width:min(94vw,550px);margin-top:10px">
                    <button id="pause-button" class="b blue pause-btn" onclick="togglePause()">⏸️ إيقاف مؤقت</button>
                    <button class="b gr pause-btn" onclick="menu()">القائمة</button>
                </div>
            `);
            document.getElementById('cv').append(gc);
            const isBoardGame = i >= 10;
            document.getElementById('game-container').classList.toggle('board-game', isBoardGame);
            gc.width = isBoardGame ? 480 : 800;
            gc.height = isBoardGame ? 480 : 450;
            gc.style.touchAction = 'none';
            setupTouchOverlay(S.n);
            S.g = G[i].mk(S.n, S.mode);
            last = performance.now();
            cancelAnimationFrame(raf);
            const loop = t => {
                const dt = Math.min(.033, (t - last) / 1000);
                last = t;
                const g = S.g;
                if (!S.paused && !g.done) g.update(dt);
                g.draw();
                if (g.done) {
                    g.t2 = (g.t2 || 0) + dt;
                    if (g.t2 > 1.2) { endScr(); return; }
                }
                raf = requestAnimationFrame(loop);
            };
            raf = requestAnimationFrame(loop);
        }

        function togglePause() {
            if (!S.g || S.g.done) return;
            S.paused = !S.paused;
            clearInputs();
            const button = document.getElementById('pause-button');
            const banner = document.getElementById('pause-banner');
            if (button) button.textContent = S.paused ? '▶️ كمّل اللعب' : '⏸️ إيقاف مؤقت';
            if (banner) banner.hidden = !S.paused;
        }

                6: ['🐦', 'طيران'], 7: ['⚡', 'تيربو'], 8: ['⚡', 'سرعة'], 9: ['🔥', 'هجوم']
            };
            for (let i = 0; i < n; i++) {
                const pad = document.createElement('div');
                pad.className = `t-pad ${posClasses[i]}`;
                pad.classList.toggle('single-action', actionOnly);
                if (!actionOnly) pad.innerHTML = `<div class="gesture-pad" data-p="${i}" role="application" aria-label="تحكم بالسحب للاعب ${i + 1}">${horizontalOnly ? 'اسحب يمين / يسار' : 'اسحب للتحرك'}</div>`;
                const action = actionLabels[S.cur];
                if (action) pad.innerHTML += `<button class="touch-key" data-p="${i}" data-key="action" aria-label="${action[1]} اللاعب ${i + 1}" title="${action[1]}">${action[0]}</button>`;
                ov.appendChild(pad);
            }

            const gesturePads = [...ov.querySelectorAll('.gesture-pad')];
            const releaseGesture = (gesturePad, pointerId) => {
                touchGestures[Number(gesturePad.dataset.p)].delete(pointerId);
                if (touchGestures[Number(gesturePad.dataset.p)].size === 0) gesturePad.classList.remove('active');
            };
            gesturePads.forEach(gesturePad => {
                const player = Number(gesturePad.dataset.p);
                const updateGesture = event => {
                    const rect = gesturePad.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
                    const radius = Math.max(24, Math.min(rect.width, rect.height) * .38);
                    let dx = (event.clientX - cx) / radius, dy = (event.clientY - cy) / radius;
                    if (matchMedia('(orientation: portrait) and (max-width: 900px)').matches) [dx, dy] = [dy, -dx];
                    const magnitude = Math.hypot(dx, dy);
                    if (magnitude < .18) { dx = 0; dy = 0; }
                    else if (magnitude > 1) { dx /= magnitude; dy /= magnitude; }
                    if (horizontalOnly) dy = 0;
                    touchGestures[player].set(event.pointerId, { dx, dy });
                };
                gesturePad.addEventListener('pointerdown', event => {
                    event.preventDefault();
                    gesturePad.classList.add('active');
                    try { gesturePad.setPointerCapture(event.pointerId); } catch { /* Continue with available pointer events. */ }
                    updateGesture(event);
                });
                gesturePad.addEventListener('pointermove', event => {
                    if (touchGestures[player].has(event.pointerId)) updateGesture(event);
                });
                gesturePad.addEventListener('pointerup', event => releaseGesture(gesturePad, event.pointerId));
                gesturePad.addEventListener('pointercancel', event => releaseGesture(gesturePad, event.pointerId));
                gesturePad.addEventListener('lostpointercapture', event => releaseGesture(gesturePad, event.pointerId));
            });

            const releaseButton = (button, pointerId) => {
                const p = Number(button.dataset.p), key = button.dataset.key;
                touchButtons[p][key].delete(pointerId);
                if (key === 'action') touchState[p].actions.delete(pointerId);
                button.classList.toggle('pressed', touchButtons[p][key].size > 0);
            };
            ov.querySelectorAll('.touch-key').forEach(button => {
                const p = Number(button.dataset.p), key = button.dataset.key;
                button.addEventListener('pointerdown', e => {
                    e.preventDefault();
                    touchButtons[p][key].add(e.pointerId);
                    if (key === 'action') touchState[p].actions.add(e.pointerId);
                    button.classList.add('pressed');
                    try { button.setPointerCapture(e.pointerId); } catch { /* The global release handler remains a fallback. */ }
                });
                button.addEventListener('pointerup', e => releaseButton(button, e.pointerId));
                button.addEventListener('pointercancel', e => releaseButton(button, e.pointerId));
                button.addEventListener('lostpointercapture', e => releaseButton(button, e.pointerId));
            });
        }

        function recordMatchRewards(g) {
            if (g.rewardsApplied) return { coins: 0, xp: 0, levelUp: false };
            g.rewardsApplied = true;
            const result = gameOutcome(g), players = S.mode === 'solo' ? 1 : S.mode === 'team' ? 4 : S.n;
            const winners = new Set(g.win || []), isDraw = result === 'draw';
            for (let i = 0; i < players; i++) {
                const stat = S.profile.playerStats[i] || { matches: 0, wins: 0, points: 0 };
                stat.matches++;
                if (winners.has(i)) { stat.wins++; stat.points += 3; S.points[i]++; }
                else if (isDraw) { stat.points++; S.points[i]++; }
                S.profile.playerStats[i] = stat;
            }
            const won = winners.has(0), coins = isDraw ? 15 : won ? 30 : 5, xp = isDraw ? 20 : won ? 50 : 10;
            const oldLevel = S.profile.level;
            S.profile.matches++;
            if (won) S.profile.wins++;
            S.profile.coins += coins; S.profile.xp += xp; refreshLevel(); saveProfile();
            return { coins, xp, levelUp: S.profile.level > oldLevel, result, players, isDraw };
        }

        function txt(t, px, py, sz, col) { x.font = `900 ${sz}px Cairo,Tahoma,sans-serif`; x.textAlign = 'center'; x.fillStyle = col || '#fff'; x.strokeStyle = '#0008'; x.lineWidth = 4; x.strokeText(t, px, py); x.fillText(t, px, py) }

        /* 1. كرة القدم */
        function football(n) {
            const ai = n == 1, tot = ai ? 2 : n, P = [], b = { x: 400, y: 225, vx: 0, vy: 0, spin: 0 }, sc = [0, 0];
            for (let i = 0; i < tot; i++) { const t = i % 2; P.push({ sx: t ? 600 : 200, sy: tot > 2 ? (i >> 1 ? 300 : 150) : 225, t, i, ai: ai && i == 1, vx: 0, vy: 0 }) }
            const rst = () => { b.x = 400; b.y = 225; b.vx = b.vy = 0; P.forEach(p => { p.x = p.sx; p.y = p.sy }) }; rst();
            const g = {
                done: false, win: [], msg: '',
                update(dt) {
                    for (const p of P) {
                        let dx, dy; if (p.ai) { const ex = b.x - p.x, ey = b.y - p.y, d = Math.hypot(ex, ey) || 1; dx = ex / d * .65; dy = ey / d * .65 } else { const k = inp(p.i); dx = k.dx; dy = k.dy; if (dx && dy) { dx *= .71; dy *= .71 } }
                        p.vx = dx * 200; p.vy = dy * 200; p.x = Math.max(16, Math.min(784, p.x + p.vx * dt)); p.y = Math.max(16, Math.min(434, p.y + p.vy * dt));
                        const ex = b.x - p.x, ey = b.y - p.y, d = Math.hypot(ex, ey); if (d < 26 && d > 0) { const nx = ex / d, ny = ey / d; b.x = p.x + nx * 26; b.y = p.y + ny * 26; b.vx = nx * 340 + p.vx * .5; b.vy = ny * 340 + p.vy * .5 }
                    }
                    const travel = Math.hypot(b.vx * dt, b.vy * dt), steps = Math.max(1, Math.ceil(travel / 5));
                    for (let step = 0; step < steps; step++) {
                        b.x += b.vx * dt / steps; b.y += b.vy * dt / steps;
                        for (const p of P) {
                            const dx = b.x - p.x, dy = b.y - p.y, distance = Math.hypot(dx, dy);
                            if (distance >= 26) continue;
                            const nx = distance > .001 ? dx / distance : (b.vx ? Math.sign(b.vx) : 1), ny = distance > .001 ? dy / distance : 0;
                            b.x = p.x + nx * 26; b.y = p.y + ny * 26;
                            const approach = b.vx * nx + b.vy * ny;
                            if (approach < 0) { b.vx -= 1.75 * approach * nx; b.vy -= 1.75 * approach * ny; }
                            b.vx += p.vx * .35; b.vy += p.vy * .35;
                        }
                    }
                    b.spin += Math.hypot(b.vx, b.vy) * dt / 10;
                    const f = Math.pow(.45, dt); b.vx *= f; b.vy *= f;
                    if (b.y < 10) { b.y = 10; b.vy *= -1 } if (b.y > 440) { b.y = 440; b.vy *= -1 }
                    const gap = b.y > 165 && b.y < 285;
                    if (b.x < 10 && !gap) { b.x = 10; b.vx = Math.abs(b.vx); }
                    if (b.x > 790 && !gap) { b.x = 790; b.vx = -Math.abs(b.vx); }
                    if (b.x < 0 && gap) { sc[1]++; rst(); }
                    else if (b.x > 800 && gap) { sc[0]++; rst(); }
                    for (let t = 0; t < 2; t++)if (sc[t] >= 3) { g.done = true; g.outcome = ai && t === 1 ? 'loss' : 'win'; g.win = P.filter(p => p.t == t && !p.ai).map(p => p.i); g.msg = ai && t == 1 ? 'خسرتي، عاود جرب' : 'فاز الفريق ' + TN[t] }
                },
                draw() {
                    x.fillStyle = '#2e8b3e'; x.fillRect(0, 0, 800, 450); x.strokeStyle = '#fffb'; x.lineWidth = 3; x.strokeRect(10, 10, 780, 430); x.beginPath(); x.moveTo(400, 10); x.lineTo(400, 440); x.stroke(); x.beginPath(); x.arc(400, 225, 55, 0, 7); x.stroke();
                    for (const side of [0, 1]) {
                        const gx = side ? 766 : 10, inward = side ? -1 : 1;
                        x.fillStyle = '#083b20'; x.fillRect(side ? 778 : 0, 165, 22, 120);
                        x.strokeStyle = '#f8fafc'; x.lineWidth = 5; x.beginPath();
                        x.moveTo(gx + (side ? 0 : 24), 165); x.lineTo(gx + (side ? 0 : 24), 285);
                        x.moveTo(gx, 165); x.lineTo(gx + 24, 165); x.moveTo(gx, 285); x.lineTo(gx + 24, 285); x.stroke();
                        x.strokeStyle = '#ffffff88'; x.lineWidth = 1.5;
                        for (let gy = 180; gy < 285; gy += 15) { x.beginPath(); x.moveTo(gx, gy); x.lineTo(gx + inward * 24, gy); x.stroke(); }
                        for (let gx2 = 4; gx2 < 24; gx2 += 8) { x.beginPath(); x.moveTo(side ? 766 + gx2 : gx2, 165); x.lineTo(side ? 766 + gx2 : gx2, 285); x.stroke(); }
                    }
                    for (const p of P) { x.fillStyle = p.ai ? TC[p.t] : playerColor(p.i); x.strokeStyle = '#fff'; x.lineWidth = 3; x.beginPath(); x.arc(p.x, p.y, 16, 0, 7); x.fill(); x.stroke(); txt(p.ai ? '🤖' : playerName(p.i), p.x, p.y + 6, 12) }
                    x.fillStyle = '#0005'; x.beginPath(); x.ellipse(b.x + 3, b.y + 7, 11, 6, 0, 0, Math.PI * 2); x.fill();
                    x.save(); x.translate(b.x, b.y); x.rotate(b.spin);
                    const ballShade = x.createRadialGradient(-4, -5, 1, 0, 0, 11);
                    ballShade.addColorStop(0, '#ffffff'); ballShade.addColorStop(.72, '#f4f4ed'); ballShade.addColorStop(1, '#9ca3a0');
                    x.fillStyle = ballShade; x.strokeStyle = '#17202a'; x.lineWidth = 1.5; x.beginPath(); x.arc(0, 0, 10, 0, Math.PI * 2); x.fill(); x.stroke();
                    x.fillStyle = '#17202a'; x.beginPath(); x.arc(0, 0, 3.2, 0, Math.PI * 2); x.fill();
                    for (let seam = 0; seam < 5; seam++) {
                        const angle = seam * Math.PI * 2 / 5;
                        x.beginPath(); x.moveTo(Math.cos(angle) * 3, Math.sin(angle) * 3); x.lineTo(Math.cos(angle + .42) * 9, Math.sin(angle + .42) * 9); x.stroke();
                    }
                    x.restore();
                    txt(sc[0] + ' 🔴  —  🟢 ' + sc[1], 400, 44, 30)
                }
            }; return g

            const max = state.turn === side; let best = max ? -Infinity : Infinity;
            for (const move of moves) {
                const value = checkersSearch(checkersApply(checkersCopy(state), move), depth - 1, alpha, beta, side);
                if (max) { best = Math.max(best, value); alpha = Math.max(alpha, best); }
                else { best = Math.min(best, value); beta = Math.min(beta, best); }
                if (beta <= alpha) break;
            }
            return best;
        }
        function checkersAI(state) {
            const moves = checkersMoves(state); let best = -Infinity, choice = moves[0];
            for (const move of moves) {
                const value = checkersSearch(checkersApply(checkersCopy(state), move), 2, -Infinity, Infinity, state.turn) + Math.random() * 4;
                if (value > best) { best = value; choice = move; }
            }
            return choice;
        }
        function checkers(n, mode) {
            const ai = mode === 'solo', state = checkersInitial(), undo = [];
            let selected = null, legal = [], cursor = { r: 5, c: 0 }, aiWait = 0, status = 'دور الأحمر';
            const game = {
                done: false, win: [], msg: '',
                finish(winner) {
                    this.done = true; this.outcome = winner ? (ai ? (winner === 'r' ? 'win' : 'loss') : 'win') : 'draw';
                    this.win = winner === 'r' ? [0] : winner === 'b' && !ai ? [1] : [];
                    this.msg = winner ? (ai ? (winner === 'r' ? 'ربحتي الدّامة! ما بقا للكمبيوتر حتى نقلة.' : 'الكمبيوتر ربح الدّامة، جرّب من جديد.') : `ربح اللاعب ${winner === 'r' ? 1 : 2} الدّامة!`) : 'تعادل فالدّامة!';
                },
                afterMove() {
                    selected = state.forced ? [...state.forced] : null; legal = state.forced ? checkersMoves(state) : [];
                    const count = state.board.flat().filter(p => p && checkersSide(p) === state.turn).length;
                    if (!count || !checkersMoves(state).length) { this.finish(state.turn === 'r' ? 'b' : 'r'); return; }
                    if (state.quiet >= 80) { this.finish(null); return; }
                    status = state.forced ? `${state.turn === 'r' ? 'الأحمر' : 'الأسود'}: كمّل القفزات` : `دور ${state.turn === 'r' ? 'الأحمر' : 'الأسود'}`;
                    if (ai && state.turn === 'b') aiWait = .32;
                },
                commit(move) {
                    if (!move.capture && !state.forced) return;
                    if (!ai || state.turn === 'r') undo.push(checkersCopy(state));
                    checkersApply(state, move); this.afterMove();
                },
                choose(r, c) {
                    if (this.done || (ai && state.turn === 'b')) return;
                    cursor = { r, c };
                    const target = selected && legal.find(m => m.to[0] === r && m.to[1] === c);
                    if (target) { this.commit(target); return; }
                    const piece = state.board[r][c];
                    if (piece && checkersSide(piece) === state.turn) { selected = [r, c]; legal = checkersMoves(state).filter(m => m.from[0] === r && m.from[1] === c); cursor = { r, c }; }
                    else if (!state.forced) { selected = null; legal = []; }
                },
                undoMove() {
                    if (!undo.length || this.done) return;
                    const previous = undo.pop(); state.board = previous.board; state.turn = previous.turn; state.forced = previous.forced; state.quiet = previous.quiet;
                    this.done = false; this.outcome = ''; this.msg = ''; selected = null; legal = []; aiWait = 0; status = state.turn === 'r' ? 'دور الأحمر' : 'دور الأسود';
                },
                restart() {
                    const fresh = checkersInitial(); state.board = fresh.board; state.turn = fresh.turn; state.forced = null; state.quiet = 0;
                    this.done = false; this.outcome = ''; this.msg = ''; selected = null; legal = []; cursor = { r: 5, c: 0 }; aiWait = 0; undo.length = 0; status = 'دور الأحمر';
                },
                handleKey(e) {
                    if (e.repeat) return;
                    const key = e.key.toLowerCase();
                    if (key.startsWith('arrow')) { if (key === 'arrowup') cursor.r = Math.max(0, cursor.r - 1); if (key === 'arrowdown') cursor.r = Math.min(7, cursor.r + 1); if (key === 'arrowleft') cursor.c = Math.max(0, cursor.c - 1); if (key === 'arrowright') cursor.c = Math.min(7, cursor.c + 1); }
                    else if (key === 'enter' || key === ' ') this.choose(cursor.r, cursor.c);
                    else if (key === 'escape' && !state.forced) { selected = null; legal = []; }
                    else if (key === 'u') this.undoMove();
                    else if (key === 'r') this.restart();
                },
                update(dt) { if (aiWait > 0) { aiWait -= dt; if (aiWait <= 0 && !this.done && state.turn === 'b') { const move = checkersAI(state); if (move) this.commit(move); } } },
                draw() {
                    x.fillStyle = '#17203c'; x.fillRect(0, 0, 480, 480); txt(status, 240, 26, 19, '#ffe082');
                    const size = 50, left = 40, top = 40;
                    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
                        const px = left + c * size, py = top + r * size; x.fillStyle = (r + c) % 2 ? '#744a35' : '#ead9bc'; x.fillRect(px, py, size, size);
                        if (selected?.[0] === r && selected?.[1] === c) { x.fillStyle = '#f4d03f77'; x.fillRect(px, py, size, size); }
                        if (cursor.r === r && cursor.c === c) { x.strokeStyle = '#34d399'; x.lineWidth = 3; x.strokeRect(px + 2, py + 2, size - 4, size - 4); }
                        const target = legal.find(m => m.to[0] === r && m.to[1] === c);
                        if (target) { x.fillStyle = target.capture ? '#e5393588' : '#155e3688'; x.beginPath(); x.arc(px + 25, py + 25, target.capture ? 21 : 7, 0, Math.PI * 2); x.fill(); }
                        const p = state.board[r][c]; if (p) { x.fillStyle = p.toLowerCase() === 'r' ? '#e74436' : '#171717'; x.beginPath(); x.arc(px + 25, py + 25, 19, 0, Math.PI * 2); x.fill(); x.strokeStyle = '#fbe6a2'; x.lineWidth = 3; x.stroke(); if (p === p.toUpperCase()) txt('♛', px + 25, py + 33, 22, '#ffe082'); }
                    }
                    x.fillStyle = '#f3c64e'; x.fillRect(130, 445, 105, 31); txt('↶ تراجع (U)', 182, 466, 13, '#1b1b1b');
                    x.fillStyle = '#f3c64e'; x.fillRect(245, 445, 105, 31); txt('↻ جديد (R)', 297, 466, 13, '#1b1b1b');
                }
            };
            gc.onpointerdown = event => {
                const rect = gc.getBoundingClientRect(), px = (event.clientX - rect.left) * gc.width / rect.width, py = (event.clientY - rect.top) * gc.height / rect.height;
                if (py >= 445 && px >= 130 && px <= 235) { game.undoMove(); return; }
                if (py >= 445 && px >= 245 && px <= 350) { game.restart(); return; }
                const c = Math.floor((px - 40) / 50), r = Math.floor((py - 40) / 50); if (r >= 0 && r < 8 && c >= 0 && c < 8) game.choose(r, c);
            };
            return game;
        }

        function shuffle(items) { for (let i = items.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[items[i], items[j]] = [items[j], items[i]]; } return items; }
        function sudokuSolvedGrid() {
            const digits = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]), bands = shuffle([0, 1, 2]), stacks = shuffle([0, 1, 2]);
            const rows = bands.flatMap(b => shuffle([0, 1, 2]).map(r => b * 3 + r));
            const cols = stacks.flatMap(b => shuffle([0, 1, 2]).map(c => b * 3 + c));
            return rows.map(r => cols.map(c => digits[(r * 3 + Math.floor(r / 3) + c) % 9]));
        }
        function sudokuSolutionCount(board, limit = 2) {
            let best = null, candidates = null;
            for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) if (!board[r][c]) {
                const used = new Set([...board[r], ...board.map(row => row[c]), ...board.slice(Math.floor(r / 3) * 3, Math.floor(r / 3) * 3 + 3).flatMap(row => row.slice(Math.floor(c / 3) * 3, Math.floor(c / 3) * 3 + 3))]);
                const options = [1, 2, 3, 4, 5, 6, 7, 8, 9].filter(n => !used.has(n));
                if (!options.length) return 0;
                if (!candidates || options.length < candidates.length) { best = [r, c]; candidates = options; if (options.length === 1) break; }
            }
            if (!best) return 1;
            let count = 0;
            for (const value of candidates) { board[best[0]][best[1]] = value; count += sudokuSolutionCount(board, limit - count); board[best[0]][best[1]] = 0; if (count >= limit) return count; }
            return count;
        }
        function sudokuPuzzle() {
            const solution = sudokuSolvedGrid(), puzzle = solution.map(row => row.slice()), cells = shuffle(Array.from({ length: 81 }, (_, i) => i));
            let removed = 0;
            for (const index of cells) {
                if (removed >= 40) break;
                const r = Math.floor(index / 9), c = index % 9, value = puzzle[r][c]; puzzle[r][c] = 0;
                if (sudokuSolutionCount(puzzle.map(row => row.slice()), 2) === 1) removed++;
                else puzzle[r][c] = value;
            }
            return { solution, puzzle };
        }
        function sudoku(n, mode) {
            const { solution, puzzle } = sudokuPuzzle(), board = puzzle.map(row => row.slice()), given = puzzle.map(row => row.map(Boolean)), undo = [];
            let selected = [0, 0], errors = 0, hints = 3, elapsed = 0, status = 'اختار خانة، ومن بعد اختار الرقم.';
            const game = {
                done: false, win: [], msg: '',
                put(value) {
                    if (this.done || !selected || given[selected[0]][selected[1]]) return;
                    const [r, c] = selected;
                    if (value && board[r][c] === value) return;
                    if (value) {
                        let duplicate = board[r].some((v, i) => i !== c && v === value) || board.some((row, i) => i !== r && row[c] === value);
                        const boxRow = Math.floor(r / 3) * 3, boxCol = Math.floor(c / 3) * 3;
                        for (let br = boxRow; br < boxRow + 3; br++) for (let bc = boxCol; bc < boxCol + 3; bc++)
                            if ((br !== r || bc !== c) && board[br][bc] === value) duplicate = true;
                        if (duplicate) { errors++; status = `هاد الرقم كاين من قبل · أخطاء ${errors}/5`; if (errors >= 5) { this.done = true; this.outcome = 'loss'; this.msg = 'وصلتي لخمس أخطاء. جرّب سودوكو جديدة!'; } return; }
                    }
                    undo.push([r, c, board[r][c]]); board[r][c] = value;
                    status = value ? 'مزيان! كمّل حلّ الشبكة.' : 'الخانة تفرغات.';
                    if (board.every((row, ri) => row.every((cell, ci) => cell === solution[ri][ci]))) { this.done = true; this.outcome = 'win'; this.win = [0]; this.msg = `حلّيتي السودوكو! الوقت ${Math.floor(elapsed / 60)}:${String(Math.floor(elapsed % 60)).padStart(2, '0')}.`; }
                },
                hint() {
                    if (hints <= 0 || this.done) { status = 'ما بقات حتى مساعدة.'; return; }
                    if (given[selected[0]][selected[1]]) { status = 'اختار خانة فارغة أولاً.'; return; }
                    hints--; this.put(solution[selected[0]][selected[1]]); status = `مساعدة مستعملة · بقاو ${hints}`;
                },
                undoMove() { const previous = undo.pop(); if (previous && !this.done) { board[previous[0]][previous[1]] = previous[2]; status = 'تراجعنا على آخر رقم.'; } },
                restart() { const fresh = sudokuPuzzle(); for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) { puzzle[r][c] = fresh.puzzle[r][c]; solution[r][c] = fresh.solution[r][c]; board[r][c] = fresh.puzzle[r][c]; given[r][c] = !!fresh.puzzle[r][c]; } errors = 0; hints = 3; elapsed = 0; undo.length = 0; this.done = false; this.outcome = ''; this.msg = ''; status = 'لغز جديد واجد.'; },
                handleKey(e) {
                    if (e.repeat) return;
                    const key = e.key.toLowerCase(), [r, c] = selected;
                    if (key === 'arrowup') selected = [Math.max(0, r - 1), c]; else if (key === 'arrowdown') selected = [Math.min(8, r + 1), c];
                    else if (key === 'arrowleft') selected = [r, Math.max(0, c - 1)]; else if (key === 'arrowright') selected = [r, Math.min(8, c + 1)];
                    else if (/^[1-9]$/.test(e.key)) this.put(Number(e.key)); else if (key === 'backspace' || key === 'delete' || key === '0') this.put(0);
                    else if (key === 'h') this.hint(); else if (key === 'u') this.undoMove(); else if (key === 'r') this.restart();
                },
                update(dt) { if (!this.done) elapsed += dt; },
                draw() {
                    x.fillStyle = '#17203c'; x.fillRect(0, 0, 480, 480); txt(`⏱ ${Math.floor(elapsed / 60)}:${String(Math.floor(elapsed % 60)).padStart(2, '0')} · ${errors}/5 · 💡${hints}`, 300, 20, 13, '#ffe082');
                    x.fillStyle = '#f3c64e'; x.fillRect(5, 3, 42, 30); txt('💡', 26, 25, 16, '#1b1b1b');
                    x.fillRect(52, 3, 42, 30); txt('↶', 73, 25, 18, '#1b1b1b');
                    x.fillRect(99, 3, 42, 30); txt('↻', 120, 25, 18, '#1b1b1b');
                    const left = 42, top = 27, size = 44;
                    for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
                        const px = left + c * size, py = top + r * size;
                        x.fillStyle = selected[0] === r && selected[1] === c ? '#f4d03f66' : given[r][c] ? '#e8d8b8' : '#fff9e8'; x.fillRect(px, py, size, size);
                        if (selected[0] === r || selected[1] === c) { x.fillStyle = '#83b8e544'; x.fillRect(px, py, size, size); }
                        if (board[r][c]) { x.font = '900 25px Cairo,Tahoma,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = given[r][c] ? '#263238' : '#125e9b'; x.fillText(board[r][c], px + 22, py + 22); }
                        x.strokeStyle = c % 3 === 0 ? '#17203c' : '#77808c'; x.lineWidth = c % 3 === 0 ? 2.5 : 1; x.strokeRect(px, py, size, size);
                        x.strokeStyle = r % 3 === 0 ? '#17203c' : '#77808c'; x.lineWidth = r % 3 === 0 ? 2.5 : 1; x.strokeRect(px, py, size, size);
                    }
                    txt(status, 240, 434, 11, '#fff');
                    for (let value = 1; value <= 9; value++) { const px = 42 + (value - 1) * 44; x.fillStyle = '#ffe082'; x.fillRect(px + 1, 438, 42, 40); txt(String(value), px + 22, 465, 19, '#18253a'); }
                }
            };
            gc.onpointerdown = event => {
                const rect = gc.getBoundingClientRect(), px = (event.clientX - rect.left) * gc.width / rect.width, py = (event.clientY - rect.top) * gc.height / rect.height;
                if (py <= 33 && px >= 5 && px <= 47) { game.hint(); return; }
                if (py <= 33 && px >= 52 && px <= 94) { game.undoMove(); return; }
                if (py <= 33 && px >= 99 && px <= 141) { game.restart(); return; }
                if (py >= 438 && py <= 478 && px >= 42 && px < 438) { game.put(Math.floor((px - 42) / 44) + 1); return; }
                const c = Math.floor((px - 42) / 44), r = Math.floor((py - 27) / 44); if (r >= 0 && r < 9 && c >= 0 && c < 9) selected = [r, c];
            };
            return game;
        }

        menu();
